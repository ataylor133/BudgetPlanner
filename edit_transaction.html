{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto; padding: 30px;">
    <h3 style="margin-top:0;">Edit Transaction</h3>

    <form class="stacked-form" method="POST" action="/edit/{{ tx.id }}">
        <label>Account:</label>
        <select name="account_name" required>
            {% for acc in accounts %}
                <option value="{{ acc.name }}" {% if tx.account_name == acc.name %}selected{% endif %}>{{ acc.name }}</option>
            {% endfor %}
        </select>

        <label>Transaction Type:</label>
        <select name="type" required>
            <option value="Deposit" {% if tx.transactionType == 'Deposit' %}selected{% endif %}>Deposit</option>
            <option value="Withdrawal" {% if tx.transactionType == 'Withdrawal' %}selected{% endif %}>Withdrawal</option>
        </select>

        <label>Amount ({{ symbol }}):</label>
        <input type="number" step="0.01" name="amount" value="{{ tx.transactionAmount }}" required>

        <label>Category (Optional):</label>
        <select name="category">
            <option value="">-- None --</option>
            {% for cat in categories %}
                <option value="{{ cat.name }}" {% if tx.category == cat.name %}selected{% endif %}>
                    {{ cat.name }} ({{ cat.trans_type }})
                </option>
            {% endfor %}
        </select>

        <label>Date:</label>
        <input type="date" name="date" value="{{ tx.transactionDate }}" required>

        <label>Description:</label>
        <input type="text" name="description" value="{{ tx.description }}" maxlength="{{ max_desc }}">

        <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
            <button type="submit" class="btn-primary">💾 Update</button>
            <a href="/" style="color: var(--text-color); text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
