{% extends 'base.html' %}

{% block content %}
<div class="card" style="text-align: center; max-width: 600px; margin: 40px auto; padding: 40px;">
    <h1 style="color: #dc3545; font-size: 64px; margin-bottom: 10px;">{{ error_code }}</h1>
    <h2>Oops! Something went wrong.</h2>
    <p style="font-size: 18px; color: var(--text-color); margin-bottom: 30px;">
        {{ error_msg }}
    </p>
    <a href="/" class="btn-primary" style="text-decoration: none; font-size: 16px;">Return to Dashboard</a>
</div>
{% endblock %}
