{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto; padding: 30px;">
    <h3 style="margin-top:0;">Edit Profile</h3>
    <form class="stacked-form" method="POST" action="/profile">
        <label>Display Name:</label>
        <input type="text" name="name" value="{{ user_name }}" required>

        <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
            <button type="submit" class="btn-primary">💾 Save Changes</button>
            <a href="/" style="color: var(--text-color); text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
